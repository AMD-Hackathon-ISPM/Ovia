worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 16m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080 default_server;
        server_name daffatrg.me www.daffatrg.me _;
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        location = /ovia {
            return 308 /ovia/;
        }

        location ~ ^/ovia(?<ovia_api_path>/api/.*)$ {
            set $ovia_api http://api:8080;
            proxy_pass $ovia_api$ovia_api_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 70s;
            proxy_send_timeout 70s;
        }

        location ~ ^/ovia(?<ovia_compat_path>/v1/.*)$ {
            set $ovia_api http://api:8080;
            proxy_pass $ovia_api$ovia_compat_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 70s;
        }

        location ~ ^/ovia(?<ovia_frontend_path>/.*)$ {
            set $ovia_frontend http://frontend:8080;
            proxy_pass $ovia_frontend$ovia_frontend_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            return 404;
        }
    }
}
