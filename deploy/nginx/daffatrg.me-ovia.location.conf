# These locations are installed in the EXISTING HTTPS
# `server_name daffatrg.me` block in D:/Hackathons/Ferry/backend/nginx.conf.
# The Ferry nginx service must also join the external `ovia-ingress` network.

location = /ovia {
    return 308 /ovia/;
}

location ^~ /ovia/ {
    client_max_body_size 16m;

    set $ovia_gateway ovia-gateway:8080;
    proxy_pass http://$ovia_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
}
