[package]
name = "ovia-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[features]
default = []
cuda = ["ort/cuda"]

[lib]
name = "ovia_backend"
path = "src/lib.rs"

[[bin]]
name = "ovia-backend"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["json", "multipart", "macros"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
futures = "0.3.31"
hex = "0.4.3"
http = "1.3.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "trace", "request-id", "limit"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-27"] }

[target.'cfg(not(windows))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-27"] }

[dev-dependencies]
approx = "0.5.1"
tempfile = "3.23.0"
